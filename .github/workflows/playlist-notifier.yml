name: Playlist ntfy notifier

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: moon-playlist-notifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check playlist and notify ntfy
        env:
          YOUTUBE_PLAYLIST_ID: PLApqyIlpej2o
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NTFY_SERVER: https://ntfy.sh
          NTFY_TOPIC: moon-playlist-7bb3596cd0321a2a662ceceb
        run: node scripts/notify-playlist.mjs

      - name: Commit updated playlist state
        run: |
          if git diff --quiet -- data/playlist-state.json; then
            echo "No playlist state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playlist-state.json
          git commit -m "Update playlist notification state"
          git push
